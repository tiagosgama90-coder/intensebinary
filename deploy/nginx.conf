# Exemplo de configuração Nginx para intensebinary.pt
# Copiar para: /etc/nginx/sites-available/intensebinary
# Depois: sudo ln -s /etc/nginx/sites-available/intensebinary /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name intensebinary.pt www.intensebinary.pt;

    # Redirecionar HTTP para HTTPS (activar depois do certificado SSL)
    # return 301 https://$host$request_uri;

    root /var/www/intensebinary;
    index index.html;

    # Compressão
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 256;

    # Cache para assets com hash
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Segurança básica
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}

